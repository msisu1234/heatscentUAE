<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <title>Heatscent | Home</title>

<style>
  body {
    font-family: Inter, Arial, sans-serif;
    padding: 0px;
  }

  h1 {
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-left: 75px;
    margin-right: 75px;
    margin-bottom: 30px;
  }

  .card {
    border: 1px solid #ddd;
    overflow: hidden;
    transition: 0.2s;
    background: white;
  }

  .card:hover {
    transform: translateY(-2%) scale(1.02);
    background: rgb(239, 239, 239);
    border: 1px solid #000000;
  }

  .card img {
    width: 100%;
    height: 250px;
    object-fit: contain;
    display: block;
  }

  .card-content {
    padding: 12px;
  }

  .card-title {
    font-size: 18px;
    text-align: center;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-price {
    font-size: 14px;
    color: #555;
    text-align: center;
    margin-top: 7px;
  }

  .card a {
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .image-wrapper {
    position: relative;
  }

  .ribbon {
    position: absolute;
    top: 12px;
    right: -5px;
    background: #ff2d00;
    color: white;
    width: 75px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .title {
    margin-left: 75px;
  }

    .carousel {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 10%;
    }

    .carousel-track {
      display: flex;            
      width: 100%;
    }

    .carousel-track img {
      width: 100%;
      height: 500px;
      object-fit: contain;
      flex-shrink: 0;     
    }

    .arrow {
      z-index: 10;     
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scale(2);
      pointer-events: auto; 
      background-color: #555555a9;
      border: 0px;
      width: 20px;
      height: 20px
    }

    .arrow:hover {
    background: rgba(0,0,0,0.6);
    }

    .arrow.left {
    left: 10px;
    }

    .arrow.right {
    right: 10px;
    }
</style>
</head>

<body>

<script>
  fetch(`nav.html?t=${Date.now()}`)
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;
    })
    .catch(err => console.error("Navigation bar failed to load", err));
</script>

<div id="navbar"></div>
<div id="carousel" class="carousel">
  <button class="arrow left" onclick="prevSlide()">&#10094;</button>

  <div class="carousel-track" id="carousel-track"></div>

  <button class="arrow right" onclick="nextSlide()">&#10095;</button>
</div>
<h1 class="title">Home</h1>
<div id="catalogue" class="grid"></div>

<script>
  const FILTER = "all"; 
  //"all" for all perfume(home screen) "men" for only mens(mens page) "women" for only women(womens page) "new"(news page)

  let carouselImages = [];
  let currentIndex = 0;

  async function loadCarousel() {
    try {
      const res = await fetch(`home.json?t=${Date.now()}`);
      const data = await res.json();

      carouselImages = data.images || [];

      const track = document.getElementById("carousel-track");
      track.innerHTML = "";

      for (const img of carouselImages) {
        const image = document.createElement("img");
        image.src = img;
        track.appendChild(image);
      }

    } catch (err) {
      console.error("Carousel failed:", err);
    }
  }

    function updateCarousel(jump = false) {
        const track = document.getElementById("carousel-track");

        if (jump) {
            track.style.transition = "none";
        } else {
            track.style.transition = "transform 0.4s ease-in-out";
        }

        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

function nextSlide() {
  if (carouselImages.length === 0) return;

  if (currentIndex === carouselImages.length - 1) {
    currentIndex = 0;
    updateCarousel(true);
  } else {
    currentIndex++;
    updateCarousel();
  }
}

function prevSlide() {
  if (carouselImages.length === 0) return;

  if (currentIndex === 0) {
    currentIndex = carouselImages.length - 1;
    updateCarousel(true);
  } else {
    currentIndex--;
    updateCarousel();
  }
}

  loadCarousel();

  async function loadCatalogue() {
    try {
      const res = await fetch(`catalogue.json?t=${Date.now()}`);
      const catalogue = await res.json();

      const container = document.getElementById("catalogue");
      container.innerHTML = "";

      for (const file of catalogue.shown) {
        const resItem = await fetch(`perfumes/${file}?t=${Date.now()}`);
        const data = await resItem.json();


        if (FILTER === "men" && data.sort.sort !== "men") continue;
        if (FILTER === "women" && data.sort.sort !== "women") continue;
        if (FILTER === "new" && data.sort.new !== "y") continue;

        const div = document.createElement("div");
        div.className = "card";

        const tagHTML = data.tag ? `<div class="ribbon">${data.tag}</div>` : "";

        div.innerHTML = `
          <a href="product.html?file=${file}">
            <div class="image-wrapper">
              ${tagHTML}
              <img src="images/${data.thumbnail}?t=${Date.now()}" alt="${data.name}">
            </div>
            <div class="card-content">
              <div class="card-title">${data.name}</div>
              <div class="card-price">AED ${data.prices["50ml"]}</div>
            </div>
          </a>
        `;

        container.appendChild(div);
      }

    } catch (err) {
      console.error("Catalogue failed:", err);
    }
  }

  loadCatalogue();

</script>

</body>
</html>
